<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 92" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&amp;family=Plus+Jakarta+Sans:ital,wght@1,600;1,700&amp;display=swap');
      .brand-arton-white {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Didot', 'Cinzel', serif;
        font-weight: 800;
        font-size: 60px;
        letter-spacing: 0.05em;
      }
      .brand-confort-gold {
        font-family: 'Plus Jakarta Sans', 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-style: italic;
        font-size: 20px;
        letter-spacing: 0.16em;
      }
    </style>
  </defs>

  <!-- Golden Elegant Undulating Swoosh Ribbon -->
  <path
    d="M 12 38 C 14 52, 30 76, 68 90 C 102 102, 142 82, 178 64 C 210 48, 250 56, 304 66 C 268 60, 222 54, 184 70 C 146 86, 102 98, 70 85 C 40 73, 24 53, 14 38 Z"
    fill="#D4A85B"
  />

  <!-- Subtle Accent Arc beneath A and R -->
  <path
    d="M 46 67 C 58 74, 82 74, 98 66 C 84 72, 58 72, 46 67 Z"
    fill="#4A6E94"
  />

  <!-- ARTON Logotype in Pure White -->
  <text
    x="38"
    y="55"
    fill="#FFFFFF"
    class="brand-arton-white"
  >ARTON</text>

  <!-- CONFORT Sub-mark in Warm Gold -->
  <text
    x="172"
    y="84"
    fill="#D4A85B"
    class="brand-confort-gold"
  >CONFORT</text>
</svg>
